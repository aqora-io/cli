[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "aqora"
description = "The aqora command line interface"
readme = "README.md"
authors = [{ name = "S.A.S Aqora Quantum", email = "hello@aqora.io" }]
requires-python = ">=3.10"
dynamic = ["version"]
# keywords = []
# classifiers = []

dependencies = ["typing-extensions>=4.13.2", "uv >=0.3.2, <1.0.0"]

[project.entry-points."fsspec.specs"]
aqora = "aqora.fsspec.AqoraFileSystem"
aqora-iceberg = "aqora.iceberg_fs.AqoraIcebergFileSystem"

[project.optional-dependencies]
venv = [
  "build >=1.2.0, <2.0.0",
  "setuptools >=61.0",
  "ujson >= 5.9.0, <6.0.0",
  "jupyterlab >= 4.2.1, < 5.0.0",
  "ipykernel >=6.29.4, <7.0.0",
  "nbconvert >= 7.16.4, <8.0.0",
  "nbformat >= 5.10.4, <6.0.0",
]

fsspec = ["fsspec>=2025.3.0"]
pyarrow = ["fsspec>=2025.3.0", "pyarrow>=17.0.0"]
qiskit = ["qio>=0.2.2", "qiskit>=2.3.1"]
pytket = ["pytket>=1.30"]
guppy = ["guppylang>=0.21"]
cirq = ["cirq-core>=1.4"]
# Cross-framework hops for the universal `aqora.QPU`. Each one only widens the
# set of formats a program can be encoded into; negotiation skips the hops whose
# extra is not installed.
qiskit-tket = ["pytket-qiskit>=0.77"]
pytket-qir = ["pytket-qir>=2.0"]
guppy-qir = ["hugr-qir>=0.1.2"]
iceberg = [
  "fsspec[http]>=2025.3.0",
  # 0.11.0 is the first release defining `pyiceberg.catalog.rest.auth`
  # `AUTH_MANAGER`, which `aqora.iceberg` imports.
  "pyiceberg>=0.11.0",
]

[project.urls]
Repository = "https://github.com/aqora-io/cli"
Documentation = "https://github.com/aqora-io/cli"

[project.scripts]
aqora = "aqora:main"

[tool.maturin]
python-source = "python"
module-name = "aqora._aqora"
strip = true
features = ["extension-module"]

[dependency-groups]
dev = [
  "fsspec>=2025.3.0",
  "pandas>=2.0.3",
  "pandas-stubs>=2.0.3.230814",
  "polars>=1.8.2",
  "pyarrow>=17.0.0",
  "pyarrow-stubs>=17.19",
  "pytest>=8.3.5",
  "pytest-asyncio>=0.24.0",
]
